<header class="app-header">
  <div class="header-container">
    <a routerLink="/" class="brand-link">
      <div class="brand-icon">
        <mat-icon>checkroom</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-name">Loja Reverbe</span>
        <span class="brand-tagline">Controle de Estoque & Vendas</span>
      </div>
    </a>

    <nav class="nav-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <mat-icon>dashboard</mat-icon>
        <span>Menu</span>
      </a>
      <a routerLink="/products" routerLinkActive="active" class="nav-link">
        <mat-icon>inventory_2</mat-icon>
        <span>Estoque</span>
      </a>
      <a routerLink="/new-product" routerLinkActive="active" class="nav-link">
        <mat-icon>add_box</mat-icon>
        <span>Novo Produto</span>
      </a>
      <a routerLink="/sales" routerLinkActive="active" class="nav-link">
        <mat-icon>point_of_sale</mat-icon>
        <span>Histórico de Vendas</span>
      </a>
    </nav>
  </div>
</header>

<main class="main-content">
  <router-outlet />
</main>
