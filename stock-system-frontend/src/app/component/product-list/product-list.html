<button matButton="outlined" (click)="goToMenu()">Voltar ao Menu</button>
<mat-grid-list cols="3">
    @for (product of products(); track product.id) {
        <mat-grid-tile>
            <mat-card class="example-card" appearance="outlined">
                <img 
                    mat-card-image 
                    [src]="product.imageUrl ? 
                        'http://localhost:8080' + product.imageUrl :
                        'https://placehold.co/400x300?text=Sem+Imagem'
                    " 
                    [alt]="product.name"
                    >
                <mat-card-content>
                    <p>{{ product.name }}</p>
                    <p>{{ product.unitPrice | currency:'BRL':'symbol':'1.2-2'}}</p>
                    <p>{{ product.size }}</p>
                    <p>Quantidade em estoque: {{ product.stockQuantity }}</p>
                </mat-card-content>
                <mat-card-actions>
                    <button matButton (click)="openEditDialog(product)">EDITAR</button>
                    <button matButton (click)="openDeleteDialog(product)">DELETAR</button>
                </mat-card-actions>
            </mat-card>
        </mat-grid-tile>
    }
     @empty {
        <p>No product found in inventory!</p>
    }
</mat-grid-list>
<mat-paginator
    [length]="totalElements()"
    [pageSize]="pageSize()"
    (page)="handlePageEvent($event)"
>
</mat-paginator>
