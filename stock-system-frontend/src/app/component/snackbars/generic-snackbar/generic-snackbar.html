<div class="snackbar-content" [class.error-state]="isError">
  <mat-icon class="toast-icon">{{ isError ? 'error' : 'check_circle' }}</mat-icon>
  <span class="toast-message" matSnackBarLabel>{{ message }}</span>
  <button mat-icon-button matSnackBarAction class="btn-close" (click)="closeSnackbar()" aria-label="Fechar">
    <mat-icon>close</mat-icon>
  </button>
</div>
