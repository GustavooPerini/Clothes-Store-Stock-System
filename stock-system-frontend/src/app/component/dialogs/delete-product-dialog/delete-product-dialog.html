<h2 mat-dialog-title>Deletar Produto</h2>

<mat-dialog-content>
    Tem certeza que gostaria de deletar esse produto?
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-flat-button (click)="deleteProduct()">Confirmar</button>
</mat-dialog-actions>
